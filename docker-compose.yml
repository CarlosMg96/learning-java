services:
  # 1. Base de Datos PostgreSQL oficial
  postgres_db:
    image: postgres:16-alpine
    container_name: fleethub_postgres
    hostname: fleethub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleethub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fleethub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleethub"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 2. API REST Spring Boot
  fleethub_api:
    build:
      context: ./fleethub-api
      dockerfile: Dockerfile
    container_name: fleethub_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fleethub_postgres:5432/fleethub
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PORT: 8080
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  fleethub_pgdata:
    driver: local
